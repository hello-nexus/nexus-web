<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script>
      (() => {
        const manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = location.pathname === '/panel/phone'
          ? '/panel-phone.webmanifest'
          : '/manifest.webmanifest';
        document.head.appendChild(manifest);
      })();
    </script>
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" href="/fonts/lexend/lexend-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet" />
    <title>Nexus</title>
    <script>
      // Sync polyfills for Chromium 83 (HYTE Q60 Android System WebView).
      // Runs before any module bundle so chunked third-party code sees the
      // patched globals even at top-level module-init time. Module scripts
      // hoist past inline `import` modules, so the polyfills.ts import alone
      // is not enough.
      (function () {
        if (typeof String.prototype.replaceAll !== 'function') {
          Object.defineProperty(String.prototype, 'replaceAll', {
            value: function (search, replacement) {
              if (search instanceof RegExp) {
                if (!search.flags.includes('g')) {
                  throw new TypeError('replaceAll must be called with a global RegExp');
                }
                return String(this).replace(search, replacement);
              }
              var s = String(search);
              var escaped = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return String(this).replace(new RegExp(escaped, 'g'), replacement);
            },
            writable: true, configurable: true,
          });
        }
        if (typeof Array.prototype.at !== 'function') {
          Object.defineProperty(Array.prototype, 'at', {
            value: function (n) {
              var len = this.length;
              var i = n < 0 ? len + n : n;
              return i >= 0 && i < len ? this[i] : undefined;
            },
            writable: true, configurable: true,
          });
        }
        if (typeof String.prototype.at !== 'function') {
          Object.defineProperty(String.prototype, 'at', {
            value: function (n) {
              var s = String(this);
              var len = s.length;
              var i = n < 0 ? len + n : n;
              return i >= 0 && i < len ? s[i] : undefined;
            },
            writable: true, configurable: true,
          });
        }
        if (typeof Object.hasOwn !== 'function') {
          Object.defineProperty(Object, 'hasOwn', {
            value: function (o, k) {
              return Object.prototype.hasOwnProperty.call(o, k);
            },
            writable: true, configurable: true,
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
