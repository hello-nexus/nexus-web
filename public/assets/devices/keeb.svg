<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- HYTE keeb: wide keyboard body drawn as a single-stroke outline,
       with the raised module on the top-left (a bar on a short neck)
       that gives the board its silhouette. -->
  <rect x="5" y="23" width="38" height="15" rx="3.5" />
  <line x1="12" y1="11" x2="12" y2="23" />
  <line x1="7" y1="11" x2="18" y2="11" />
</svg>
