<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tenkeyless keyboard silhouette: rounded-rect body, three
       horizontal row hints, and a spacebar slot. Keeps the icon
       readable at sidebar-row size without listing individual
       keys. -->
  <rect x="4" y="16" width="40" height="20" rx="2.5" />
  <line x1="9" y1="21" x2="39" y2="21" />
  <line x1="9" y1="26" x2="39" y2="26" />
  <line x1="16" y1="32" x2="32" y2="32" />
</svg>
