        d="M8 13 H40 A5 5 0 0 1 45 18 V26 A5 5 0 0 1 40 31 H8 A5 5 0 0 1 3 26 V18 A5 5 0 0 1 8 13 Z
           M37.2 22 a2.3 2.3 0 1 0 4.6 0 a2.3 2.3 0 1 0 -4.6 0 Z" />
  <rect x="9.75" y="30" width="4.5" height="5" rx="1" />
  <rect x="17.75" y="30" width="4.5" height="5" rx="1" />
  <rect x="25.75" y="30" width="4.5" height="5" rx="1" />
  <rect x="33.75" y="30" width="4.5" height="5" rx="1" />
</svg>
