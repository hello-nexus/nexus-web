<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="currentColor">
  <!-- HYTE SmartHub: flat landscape hub silhouette in the NP50 idiom, the
       four ARGB port feet hanging off the bottom edge. fill-rule evenodd
