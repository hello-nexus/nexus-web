  <rect x="16" y="10" width="16" height="20" rx="1.5" />
  <rect x="18" y="13" width="5" height="5" rx="0.8" stroke-width="1" />
  <rect x="25" y="13" width="5" height="5" rx="0.8" stroke-width="1" />
</svg>
