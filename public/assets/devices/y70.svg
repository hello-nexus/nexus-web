<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- HYTE Y70 Touch: square-ish PC case (closer to a cube than a
       traditional tower) with the portrait touchscreen mounted on
       the front-right panel. Outer rect = case body, inset portrait
       rect = the touchscreen on the front face. -->
  <rect x="6" y="6" width="36" height="36" rx="3" />
  <rect x="25" y="10" width="13" height="28" rx="1.5" />
</svg>
