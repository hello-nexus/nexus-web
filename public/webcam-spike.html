<!doctype html>
<!-- P0 throwaway spike: proves getUserMedia + WebCodecs inside the phone
     WebViews. Replaced by the real Camera widget in P4. -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webcam Spike</title>
<style>
  body { font: 14px -apple-system, Roboto, sans-serif; background: #111; color: #eee; margin: 16px; }
  video { width: 100%; max-width: 480px; background: #000; border-radius: 8px; }
  .row { margin: 6px 0; }
  .ok { color: #6f6; } .bad { color: #f66; } .warn { color: #fc6; }
  button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 0; }
  pre { white-space: pre-wrap; word-break: break-all; color: #aaa; }
</style>
</head>
<body>
<h2>Webcam capture spike</h2>
<div class="row">secureContext: <b id="sec"></b></div>
<div class="row">origin: <b id="origin"></b></div>
<div class="row">getUserMedia: <b id="gum">?</b></div>
<div class="row">VideoEncoder (WebCodecs): <b id="vecls">?</b></div>
<div class="row">H.264 baseline support: <b id="h264">?</b></div>
<div class="row"><button id="start">Start camera</button></div>
<div class="row">capture: <b id="cap">idle</b></div>
<div class="row">encode: <b id="enc">idle</b></div>
<video id="v" autoplay playsinline muted></video>
<pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; };
const mark = (id, ok, text) => { const e = $(id); e.textContent = text; e.className = ok ? 'ok' : 'bad'; };

mark('sec', window.isSecureContext, String(window.isSecureContext));
$('origin').textContent = location.origin;
mark('gum', !!navigator.mediaDevices?.getUserMedia, navigator.mediaDevices?.getUserMedia ? 'available' : 'MISSING');
mark('vecls', 'VideoEncoder' in window, 'VideoEncoder' in window ? 'available' : 'MISSING');

if ('VideoEncoder' in window) {
  VideoEncoder.isConfigSupported({
    codec: 'avc1.42E01F', width: 1280, height: 720,
    bitrate: 4_000_000, framerate: 30,
  }).then(r => mark('h264', r.supported, r.supported ? 'supported' : 'NOT supported'))
    .catch(e => mark('h264', false, 'probe error: ' + e.message));
} else {
  mark('h264', false, 'n/a');
}

$('start').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' },
      audio: false,
    });
    $('v').srcObject = stream;
    const track = stream.getVideoTracks()[0];
    mark('cap', true, 'LIVE ' + JSON.stringify(track.getSettings()));
    const devs = await navigator.mediaDevices.enumerateDevices();
    log('cameras: ' + devs.filter(d => d.kind === 'videoinput').map(d => d.label || d.deviceId).join(' | '));
    if ('VideoEncoder' in window) encodeProbe(track);
  } catch (e) {
    mark('cap', false, e.name + ': ' + e.message);
  }
};

// Encode a few real frames to prove the hardware encoder path end to end.
async function encodeProbe(track) {
  try {
    let chunks = 0, bytes = 0;
    const enc = new VideoEncoder({
      output: (chunk) => { chunks++; bytes += chunk.byteLength; if (chunks === 30) {
        mark('enc', true, `30 chunks, ${(bytes / 1024).toFixed(0)} KiB total`);
        enc.close(); proc.close?.();
      } },
      error: (e) => mark('enc', false, 'encoder error: ' + e.message),
    });
    const s = track.getSettings();
    enc.configure({ codec: 'avc1.42E01F', width: s.width, height: s.height,
                    bitrate: 4_000_000, framerate: s.frameRate || 30,
                    latencyMode: 'realtime' });
    const proc = new MediaStreamTrackProcessor({ track });
    const reader = proc.readable.getReader();
    mark('enc', true, 'encoding...');
    let n = 0;
    while (n < 31) {
      const { value: frame, done } = await reader.read();
      if (done || !frame) break;
      enc.encode(frame, { keyFrame: n % 30 === 0 });
      frame.close();
      n++;
    }
  } catch (e) {
    mark('enc', false, e.name + ': ' + e.message);
    if (!('MediaStreamTrackProcessor' in window)) log('MediaStreamTrackProcessor missing - would need canvas fallback');
  }
}
</script>
</body>
</html>
