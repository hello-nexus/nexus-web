<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
  <!-- Outer ring. -->
  <circle cx="50" cy="50" r="46" stroke-width="1" opacity="0.18" />

  <!-- Hour markers: 12 at every 30°. The renderer doesn't transform per-marker
       so we hand-place them. Major (every 3rd) is longer. -->
  <g stroke-width="1.2" opacity="0.6">
    <line class="marker-major" x1="50" y1="8"  x2="50" y2="16" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(30 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(60 50 50)" />
    <line class="marker-major" x1="50" y1="8"  x2="50" y2="16" transform="rotate(90 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(120 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(150 50 50)" />
    <line class="marker-major" x1="50" y1="8"  x2="50" y2="16" transform="rotate(180 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(210 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(240 50 50)" />
    <line class="marker-major" x1="50" y1="8"  x2="50" y2="16" transform="rotate(270 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(300 50 50)" />
    <line class="marker"       x1="50" y1="8"  x2="50" y2="13" transform="rotate(330 50 50)" />
  </g>

  <!-- Hands. The renderer overwrites their `transform` each tick from data.now.*Angle. -->
  <line class="hour-hand"   x1="50" y1="50" x2="50" y2="24" stroke-width="3"   stroke-linecap="round" />
  <line class="minute-hand" x1="50" y1="50" x2="50" y2="14" stroke-width="2"   stroke-linecap="round" />
  <line class="second-hand" x1="50" y1="56" x2="50" y2="12" stroke-width="0.8" stroke-linecap="round" opacity="0.85" />

  <!-- Center pin. -->
  <circle cx="50" cy="50" r="1.6" fill="currentColor" stroke="none" />
</svg>
