<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Airflow variants</title>
<style>
  :root { --text: #f5f5f5; --text-dim: #888888; --accent: #3b82f6; --bad: #ef4444; --warn: #f59e0b; --airflow-cool: #1e9bff; --airflow-purple: #a53cff; }
  html, body { margin: 0; height: 100%; background: #0f0f0f; color: #f5f5f5; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; }
  #bar a { color: #f5f5f5; text-decoration: none; padding: 4px 10px; border: 1px solid #444; border-radius: 6px; background: #1a1a1a; }
  #bar a.on { background: #2563eb; border-color: #3b82f6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<script type="module" src="./airflow.ts"></script>
</body>
</html>
